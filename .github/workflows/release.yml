# Builds and publishes a Flipleaf release.
# Run it from Actions → Release → Run workflow (optionally with "What's new" notes).
#
# This (private) repository holds the source. The release is published in the PUBLIC
# repository vasileiostripolidis/flipleaf with exactly three downloads: Windows (.exe),
# macOS (universal .dmg) and Linux (.AppImage). The in-app updater's files (latest.json and
# the macOS update package) go to the public website under /updates/.
# If the STORE_* repository variables are set, a Microsoft Store package (.msix) is built
# too and attached to the workflow run, ready to upload to Partner Center.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown on the release page and in the in-app update dialog)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: Windows
            platform: windows-latest
            args: "--bundles nsis"
          - os: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
          - os: Linux
            platform: ubuntu-22.04
            args: "--bundles appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect files
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          case "${{ matrix.os }}" in
            Windows)
              f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
              cp "$f" "out/Flipleaf-$V-Windows.exe"
              cp "$f.sig" out/windows.sig ;;
            macOS)
              d=src-tauri/target/universal-apple-darwin/release/bundle
              cp $d/dmg/*.dmg "out/Flipleaf-$V-macOS.dmg"
              cp $d/macos/*.app.tar.gz out/Flipleaf-macOS.app.tar.gz
              cp $d/macos/*.app.tar.gz.sig out/macos.sig ;;
            Linux)
              f=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
              cp "$f" "out/Flipleaf-$V-Linux.AppImage"
              cp "$f.sig" out/linux.sig ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: out/
          retention-days: 7

  store:
    if: vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Store build (no built-in updater)
        run: npx tauri build --features store --no-bundle
      - name: Package for the Microsoft Store
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python .github/scripts/make_msix.py "$V" "out/Flipleaf-$V-Store.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Store
          path: out/*.msix
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{Windows,macOS,Linux}"
          merge-multiple: true

      - name: Release notes and update manifest
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          python3 .github/scripts/release_files.py "$V" dist

      - name: Publish the release (public repository)
        run: |
          gh release create "v$V" \
            "dist/Flipleaf-$V-Windows.exe" "dist/Flipleaf-$V-macOS.dmg" "dist/Flipleaf-$V-Linux.AppImage" \
            --repo vasileiostripolidis/flipleaf --title "Flipleaf v$V" --notes-file dist/body.md --latest

      - name: Publish the website with the new updater files
        run: .github/scripts/publish_site.sh dist
