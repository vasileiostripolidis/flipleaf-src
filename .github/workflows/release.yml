# Builds and publishes a Flipleaf release.
# Run it from Actions → Release → Run workflow (optionally with "What's new" notes).
#
# This (private) repository holds the source. The release is published in the PUBLIC
# repository vasileiostripolidis/flipleaf with exactly three downloads: Windows (.exe),
# macOS (universal .dmg) and Linux (.AppImage). The in-app updater's files (latest.json and
# the macOS update package) go to the public website under /updates/.
# The builds upload their files straight into a draft of the public release (no workflow
# artifacts, so the private repository's artifact storage is never needed); the publish job
# then writes the notes and update manifest, keeps only the three downloads and publishes it.
# If the STORE_* repository variables are set, a Microsoft Store package (.msix) is built
# too and attached to the workflow run, ready to upload to Partner Center.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown on the release page and in the in-app update dialog)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Draft release in the public repository
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "v$V" --repo vasileiostripolidis/flipleaf >/dev/null 2>&1 ||
            gh release create "v$V" --repo vasileiostripolidis/flipleaf --draft --title "Flipleaf v$V" --notes "Preparing…"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: Windows
            platform: windows-latest
            args: "--bundles nsis"
          - os: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
          - os: Linux
            platform: ubuntu-22.04
            args: "--bundles appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build
        run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect files
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          case "${{ matrix.os }}" in
            Windows)
              f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
              cp "$f" "out/Flipleaf-$V-Windows.exe"
              cp "$f.sig" out/windows.sig ;;
            macOS)
              d=src-tauri/target/universal-apple-darwin/release/bundle
              cp $d/dmg/*.dmg "out/Flipleaf-$V-macOS.dmg"
              cp $d/macos/*.app.tar.gz out/Flipleaf-macOS.app.tar.gz
              cp $d/macos/*.app.tar.gz.sig out/macos.sig ;;
            Linux)
              f=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
              cp "$f" "out/Flipleaf-$V-Linux.AppImage"
              cp "$f.sig" out/linux.sig ;;
          esac
          ls -la out

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "v$V" out/* --repo vasileiostripolidis/flipleaf --clobber

  store:
    if: vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Store build (no built-in updater)
        run: npx tauri build --features store --no-bundle
      - name: Package for the Microsoft Store
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          python .github/scripts/make_msix.py "$V" "out/Flipleaf-$V-Store.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: Microsoft-Store
          path: out/*.msix
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Files from the draft release
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          gh release download "v$V" --repo vasileiostripolidis/flipleaf --dir release --clobber
          ls -la release

      - name: Release notes and update manifest
        run: python3 .github/scripts/release_files.py "$V" release

      - name: Publish the release (public repository)
        run: |
          R=vasileiostripolidis/flipleaf
          # only the three downloads stay on the release page; the updater files go to the website
          for a in windows.sig macos.sig linux.sig Flipleaf-macOS.app.tar.gz; do gh release delete-asset "v$V" "$a" --repo $R -y || true; done
          gh release edit "v$V" --repo $R --title "Flipleaf v$V" --notes-file release/body.md --draft=false --latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Publish the website with the new updater files
        run: .github/scripts/publish_site.sh release
