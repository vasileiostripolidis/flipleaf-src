# Builds Flipleaf installers for Windows, macOS and Linux.
# Run it: push a tag like v1.0.0  (git tag v1.0.0 && git push --tags)
# or press "Run workflow" in the Actions tab.
# The installers appear as a draft Release; publish it to make the downloads public.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown on the release page and in the in-app update dialog)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest          # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest          # Intel Macs
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Flipleaf v__VERSION__"
          releaseBody: |
            ${{ inputs.notes != '' && format('### What''s new{0}{1}{0}', fromJSON('"\n"'), inputs.notes) || '' }}
            ### Downloads

            | Platform | File |
            |:--|:--|
            | **Windows** 10 / 11 | `Flipleaf_x.y.z_x64-setup.exe` (or `.msi` for managed installs) |
            | **macOS** · Apple silicon | `Flipleaf_x.y.z_aarch64.dmg` |
            | **macOS** · Intel | `Flipleaf_x.y.z_x64.dmg` |
            | **Linux** | `.AppImage` · `.deb` · `.rpm` |
            | **Web** | [vasileiostripolidis.github.io/flipleaf](https://vasileiostripolidis.github.io/flipleaf/) |

            > [!NOTE]
            > Builds are not code-signed yet. **Windows:** *More info → Run anyway*. **macOS:** right-click the app → *Open*.

            Offline · no telemetry · [Privacy](https://github.com/vasileiostripolidis/flipleaf/blob/main/PRIVACY.md) · [License](https://github.com/vasileiostripolidis/flipleaf/blob/main/EULA.md)
          releaseDraft: true
          updaterJsonPreferNsis: true
          prerelease: false
          args: ${{ matrix.args }}
