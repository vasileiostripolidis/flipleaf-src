# Refreshes the download counters shown on the public project page, every 6 hours.
name: Download stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/publish_stats.sh
