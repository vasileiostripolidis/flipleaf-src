[package]
name = "flipleaf"
version = "1.7.0"
description = "Flipleaf: a feather-light PDF reader"
authors = ["Vasileios Tripolidis"]
license = "MIT"
edition = "2021"

[lib]
name = "flipleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
